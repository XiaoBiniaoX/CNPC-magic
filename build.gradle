plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'eclipse'
    id 'maven-publish'
}

version = '1.0.0'
group = 'top.cnpcmagic'
archivesBaseName = 'cnpcmagic'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.debug.export', 'true'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                cnpcmagic {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                cnpcmagic {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'cnpcmagic', '--all', '--output', file('src/generated/resources/')
            mods {
                cnpcmagic {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.6'
    // CNPC 自身 MC 成员为 SRG 名，必须 deobf 后用 official 名编译
    implementation fg.deobf("cnpc-deobf-src:cnpc-deobf-src:1.0")
    // 铁魔法只调用其自身 API，不需要 deobf
    compileOnly files('libs/iron-spellbooks-src.jar')
    compileOnly files('libs/[诡厄巫法] goety-2.5.60.0.jar')
    implementation fg.deobf("playeranimator:player-animation-lib-forge:1.0.2-rc1+1.20")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'cnpcmagic.refmap.json'
    config 'mixins.cnpcmagic.json'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:-processing'
}

tasks.named('jar', Jar).configure {
    archiveFileName = 'CNPC magic for 1.20.1.jar'
}
