[[mods]]
modId="cnpcmagic"
version="${mod_version}"
displayName="CNPC魔法拓展"
displayURL="https://space.bilibili.com/353609880"
authors="XiaoBiniaoX"
description='''为 Custom NPCs 的 NPC 编辑界面增加“魔法”页签：
每个魔法体系可添加多条独立法术，配置等级、每轮次数、冷却与触发距离。
必需 CNPC增强（cnpcplus）与 Player Animation Library，支持人形 NPC 施法动画。
可选支持铁魔法、诡厄巫法与新生魔艺，亦提供内置法术库、独立预览和脚本 API。'''

[[mixins]]
config="mixins.cnpcmagic.json"

