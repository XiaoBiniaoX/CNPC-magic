displayURL="https://space.bilibili.com/353609880"
authors="XiaoBiniaoX"
description='''为 Custom NPCs 的 NPC 编辑界面增加“魔法”页签：
每个魔法体系可添加多条独立法术，配置等级、每轮次数、冷却与触发距离。
可选支持铁魔法与诡厄巫法；必需 player-animation-lib，支持人形 NPC 施法动画。'''

